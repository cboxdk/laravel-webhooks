name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate (style, types, licenses, SBOM, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # A shipped dependency with a published advisory fails here; the fix is an
      # upgrade, not a rerun. Dev tooling never ships and is excluded.
      - name: Audit shipped dependencies
        run: composer audit --no-dev

      - name: Licenses stay permissive
        run: composer license-check

      # sbom.json is committed. When composer.lock moves, regenerate and commit both.
      - name: The SBOM matches the lock file
        run: composer sbom-check

  tests:
    name: P${{ matrix.php }} - L${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '^10.0'
            pest: '^4.0'
          - laravel: '13.*'
            testbench: '^11.0'
            pest: '^5.0'
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, intl, sqlite, pdo_sqlite
          coverage: none

      # Each cell resolves its own lock: Laravel 12 needs Testbench 10 and Pest 4,
      # Laravel 13 needs Testbench 11 and Pest 5 (PHPUnit tracks Pest, not Laravel).
      - name: Install dependencies for Laravel ${{ matrix.laravel }}
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Installed versions
        run: composer show -D

      - name: Tests
        run: vendor/bin/pest --ci
